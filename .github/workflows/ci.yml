name: Compatibility

on:
  push:
    branches: [main, dev, 'codex/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      XDG_CACHE_HOME: ${{ runner.temp }}/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyvisa-sim
      - name: Record environment
        run: |
          python --version
          python -m pip list
      - name: Require VISA simulator
        run: python -c 'import pyvisa_sim'
      - name: Regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile sources
        run: python -m compileall -q softlab
      - name: Import smoke check
        run: python -c 'import softlab; print(softlab.__version__)'
